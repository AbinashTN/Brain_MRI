name: "CD"

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize deployments so two runs cannot update the service simultaneously.
concurrency:
  group: cloud-run-production
  cancel-in-progress: false

env:
  PROJECT_ID: "project-e4b8c5a9-80ef-4746-922"
  REGION: "europe-west1"
  SERVICE: "mri-brain"

jobs:
  deploy:
    # Manual runs must also use main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy application to Cloud Run
        run: |
          gcloud run compose up docker-compose.yml \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --allow-unauthenticated \
            --quiet

      - name: Show application URL
        run: |
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)'
